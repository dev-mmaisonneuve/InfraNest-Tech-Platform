version: 2

updates:
  # The Next.js app. Grouped so a routine week produces one reviewable PR
  # instead of a dozen, and capped so the queue stays small enough to actually
  # read — an ignored Dependabot backlog is how the postcss and sharp
  # advisories accumulated unnoticed in the first place.
  - package-ecosystem: npm
    directory: /platform-infrastructure
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors arrive as individual PRs: next@16 is a deliberate migration, not
    # something to sweep in with a routine batch.
    #
    # Two exceptions, both re-verified on 2026-08-30 against typescript@7.0.2
    # and eslint@10.9.1, and both still failing:
    #
    #   TypeScript 7.0 — "typescript-eslint does not support TS 7.0".
    #   ESLint 10      — breaks eslint-plugin-react's rule loader.
    #
    # Without these entries Dependabot reopens an unmergeable PR on every
    # release of either.
    #
    # Both are scoped to version ranges rather than to semver-major, because
    # ignore rules apply to SECURITY updates as well as routine ones. Ignoring a
    # whole major would mean a vulnerability fixed only in that major never
    # produces a remediation PR — turning a temporary incompatibility into a
    # permanent blind spot.
    #
    # TypeScript is pinned to 7.0.x rather than 7.x because upstream states
    # support targets TS >=7.1 (typescript-eslint#10940). 7.0 is a dead end by
    # design, so ignoring the whole major would silence the very release that
    # unblocks us; scoped this way, 7.1 arrives as an ordinary PR and announces
    # itself. ESLint cannot work that way — the fix has to ship in
    # eslint-plugin-react, not in a new ESLint version, so no version range can
    # signal it, and that half is date-driven in INT-44 instead.
    #
    # Remove each entry once its ecosystem support lands — tracked in INT-44.
    ignore:
      - dependency-name: typescript
        versions: ["7.0.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    commit-message:
      prefix: "deps"
      include: scope

  # Keeps actions/checkout and actions/setup-node current. These run with repo
  # credentials, so a stale pinned action is a supply-chain concern rather than
  # a housekeeping one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
