name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # The Next.js app lives in a subdirectory of this repo.
    defaults:
      run:
        working-directory: platform-infrastructure

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Keep this matching the Node version the Vercel project builds with.
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A dependency can carry a published CVE and still typecheck, test and
      # build cleanly — none of those steps ask whether anything is known-broken.
      # Fails on high and critical only: moderate advisories in transitive dev
      # dependencies would block merges without a corresponding real risk.
      #
      # `npm audit` exits 1 both when it finds advisories and when the registry
      # refuses the request, so the exit code alone cannot tell a real finding
      # from an outage — and npm's quick-audit endpoint has been returning
      # 400 "Invalid package tree" intermittently while it is retired, after
      # hanging for six minutes first. That failed builds carrying no dependency
      # change at all. The report is parsed instead: a real result carries
      # metadata.vulnerabilities, an outage carries `error`.
      #
      # An unreachable registry warns rather than fails. A broken audit endpoint
      # is not evidence of a vulnerability, and blocking every merge on npm's
      # uptime buys nothing; the warning is annotated on the run so a persistent
      # outage is visible rather than silent.
      - name: Audit dependencies
        run: |
          set -uo pipefail
          set +e

          cat > "${RUNNER_TEMP}/check-audit.mjs" <<'JS'
          let raw = "";
          process.stdin.on("data", (chunk) => (raw += chunk));
          process.stdin.on("end", () => {
            let report;
            try {
              report = JSON.parse(raw);
            } catch {
              process.exit(2);
            }
            if (report.error) process.exit(2);

            const counts = report.metadata?.vulnerabilities ?? {};
            const blocking = (counts.high ?? 0) + (counts.critical ?? 0);
            if (blocking > 0) {
              console.error(`${blocking} high or critical advisories.`);
              process.exit(1);
            }
            console.log("No high or critical advisories.");
            process.exit(0);
          });
          JS

          for attempt in 1 2 3; do
            report=$(npm audit --json --fetch-timeout=60000 2>/dev/null)
            printf '%s' "$report" | node "${RUNNER_TEMP}/check-audit.mjs"
            status=$?

            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -eq 1 ]; then exit 1; fi

            echo "Audit endpoint unavailable (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done

          echo "::warning::npm audit could not reach the registry after three attempts. The dependency audit did not run for this commit."

      # Catches what types and tests cannot: exhaustive hook dependency arrays,
      # raw <img> where next/image belongs, and the jsx-a11y rules.
      - name: Lint
        run: npm run lint

      # Cheapest checks first so a failure reports quickly.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Runs without any secrets: every page is static or renders without env
      # vars, and the form routes only read them at request time.
      - name: Build
        # lib/site-url.ts fails production builds when this is absent, by
        # design — CI must therefore say what the real site URL is rather
        # than silently building against a localhost fallback.
        env:
          NEXT_PUBLIC_SITE_URL: https://infranests.com
        run: npm run build
